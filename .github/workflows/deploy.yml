name: Refresh pool data and deploy

# GeckoTerminal's free tier allows 30 requests a minute and throttles harder
# when it has seen recent traffic: observed runs ranged from 20 minutes to 143.
# The job is given room for the bad case, and keeps the committed pools.json if
# it still does not finish. Either way this belongs in CI, never in a page load.

on:
  schedule:
    - cron: '41 3 * * *' # 03:41 UTC, off the hour
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the push's base commit to see what actually changed

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The scrape is the entire cost of this job — every recent run took 35 to 68 minutes,
      # including one that changed nothing but the README. A change to presentation code
      # cannot alter what the scraper would collect, so it does not need to run.
      #
      # Deliberately a WHITELIST: anything not recognised means scrape. src/lib is NOT on it,
      # because scripts/collect.mjs imports src/lib/listing.mjs — a change there really does
      # change the collected data. Cron and manual runs always scrape.
      - name: Decide whether to re-scrape
        id: decide
        run: |
          need=true
          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$before" "${{ github.sha }}")
              echo "changed in this push:"; echo "$changed" | sed 's/^/  /'
              if ! echo "$changed" | grep -qvE '^(src/(components/|App\.jsx$|main\.jsx$|styles\.css$)|index\.html$|README\.md$|\.github/)'; then
                need=false
              fi
            else
              echo "base commit unavailable — scraping to be safe"
            fi
          fi
          echo "scrape=$need" >> "$GITHUB_OUTPUT"
          echo "decision: scrape=$need"

      # If GeckoTerminal is unreachable or rate-limits us out, keep the
      # committed pools.json rather than publishing an empty table.
      - name: Refresh pool data
        if: steps.decide.outputs.scrape == 'true'
        run: npm run collect
        continue-on-error: true

      - name: Skipping the scrape
        if: steps.decide.outputs.scrape != 'true'
        run: echo "Front-end-only change — building against the committed pools.json."

      - run: npm run build

      - name: Publish dist to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
